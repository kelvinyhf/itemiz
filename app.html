<!DOCTYPE html>
<html lang="en">
<head>
  
  <!-- Theme Detection -->
  <script>
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark');
    }
  </script>
  
  <!-- Basic Meta Tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- SEO Meta Tags -->
  <title>My Boards - Boardy</title>
  <meta name="description" content="A deadly simple Kanban web app, no ads, no distractions, free forever.">
  <meta name="author" content="KelvinY">
  <link rel="canonical" href="https://boardy.pages.dev/app">
  
  <!-- Open Graph -->
  <meta property="og:title" content="My Boards - Boardy">
  <meta property="og:description" content="A deadly simple Kanban web app, no ads, no distractions, free forever.">
  <meta property="og:image" content="IMAGE">
  <meta property="og:url" content="https://boardy.pages.dev/app">
  <meta property="og:type" content="website">
  
  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="My Boards - Boardy">
  <meta name="twitter:description" content="A deadly simple Kanban web app, no ads, no distractions, free forever.">
  <meta name="twitter:image" content="IMAGE">
  
  <!-- iOS Optimization -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  
  <!-- External Files -->
  <!-- <link rel="icon" type="image/[TYPE]+xml" sizes="any" href="FAV">
  <link rel="apple-touch-icon" href="APPLE"> -->
  
  <!-- CSS -->
  <link rel="stylesheet" href="./assets/libraries/radix-colors.css">
  <script>
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      fetch('./input.css')
        .then(res => res.text())
        .then(cssContent => {
          
          const style = document.createElement('style');
          style.type = 'text/tailwindcss';
          style.textContent = cssContent;
          document.head.appendChild(style);
          
          const cdnScript = document.createElement('script');
          cdnScript.src = './assets/libraries/tailwindcss.js';
          cdnScript.defer = true;
          document.head.appendChild(cdnScript);
          
        })
        .catch(err => console.error(err));
    } else {
      document.write('<link rel="stylesheet" href="./output.css">');
    }
  </script>
  
  <!-- Vue -->
  <script src="./assets/libraries/vue.js" defer></script>
  <script src="./assets/libraries/sortable.js" defer></script>
  <script src="./assets/libraries/vuedraggable.js" defer></script>
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const { createApp, ref, reactive, computed, watch, onMounted } = Vue;
    const app = createApp({
      setup() {

        /* const list = ref([
          {
            id: 1,
            title: 'To Do',
            cards: [
              { id: 11, name: 'Item 1', desc: 'Desc 1' },
              { id: 12, name: 'Item 2', desc: 'Desc 2' },
              { id: 13, name: 'Item 3', desc: 'Desc 3' },
              { id: 14, name: 'Item 4', desc: 'Desc 4' }
            ]
          }
        ]); */

        const timeLeft = ref(5);
        const isFallen = ref(false);

        onMounted(() => {
          const timer = setInterval(() => {
            if (timeLeft.value > 1) {
              timeLeft.value--;
            } else {
              timeLeft.value = 0;
              isFallen.value = true;
              clearInterval(timer);
            }
          }, 1000);
        });

        return { timeLeft, isFallen };
      }
    });

    // app.component('draggable', window.vuedraggable);
    app.mount('#app');
  });
  </script>
  
</head>
<body class="w-screen h-screen bg-gray-2 overflow-hidden overscroll-none select-none">
  <div id="app" class="w-full h-full">
    <h1 class="sr-only">My Board</h1>
    <main class="w-full h-full relative bg-[radial-gradient(var(--gray-3)_2px,transparent_2px)] [background-size:24px_24px]">
      
      <div
        class="absolute left-1/2 -translate-x-1/2 w-64 p-5 bg-amber-3 border border-amber-6 rounded-xl shadow-md"
        :class="isFallen ? 'top-full -translate-y-full opacity-50 transition-all duration-500' : 'top-1/3 -rotate-2'
        ">
        <div class="flex justify-between font-mono font-bold text-xs mb-2">
          <span>{{ timeLeft }}s</span>
        </div>
        <h2 class="font-bold text-amber-12">My First Boardy Note!</h2>
      </div>

    </main>
  </div>
</body>
</html>
