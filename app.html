<!DOCTYPE html>
<html lang="en">
<head>
  
  <!-- Theme Detection -->
  <script>
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark');
    }
  </script>
  
  <!-- Basic Meta Tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- SEO Meta Tags -->
  <title>My Boards - Boardy</title>
  <meta name="description" content="A deadly simple Kanban web app, no ads, no distractions, free forever.">
  <meta name="author" content="KelvinY">
  <link rel="canonical" href="https://boardy.pages.dev/app">
  
  <!-- Open Graph -->
  <meta property="og:title" content="My Boards - Boardy">
  <meta property="og:description" content="A deadly simple Kanban web app, no ads, no distractions, free forever.">
  <meta property="og:image" content="IMAGE">
  <meta property="og:url" content="https://boardy.pages.dev/app">
  <meta property="og:type" content="website">
  
  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="My Boards - Boardy">
  <meta name="twitter:description" content="A deadly simple Kanban web app, no ads, no distractions, free forever.">
  <meta name="twitter:image" content="IMAGE">
  
  <!-- iOS Optimization -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  
  <!-- External Files -->
  <!-- <link rel="icon" type="image/[TYPE]+xml" sizes="any" href="FAV">
  <link rel="apple-touch-icon" href="APPLE"> -->
  
  <!-- CSS -->
  <link rel="stylesheet" href="./assets/libraries/radix-colors.css">
  <script>
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      fetch('./input.css')
        .then(res => res.text())
        .then(cssContent => {
          
          const style = document.createElement('style');
          style.type = 'text/tailwindcss';
          style.textContent = cssContent;
          document.head.appendChild(style);
          
          const cdnScript = document.createElement('script');
          cdnScript.src = './assets/libraries/tailwindcss.js';
          cdnScript.defer = true;
          document.head.appendChild(cdnScript);
          
        })
        .catch(err => console.error(err));
    } else {
      document.write('<link rel="stylesheet" href="./output.css">');
    }
  </script>
  
  <!-- Vue -->
  <script src="./assets/libraries/vue.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/vuedraggable@4.1.0/dist/vuedraggable.umd.min.js" defer></script>
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const { createApp, ref, reactive, computed, watch, onMounted } = Vue;
    const app = createApp({
      setup() {
        const lists = ref([
          {
            id: 1,
            title: 'To Do',
            cards: [
              { id: 11, name: 'Fix CSS bug', desc: 'that bug u know' },
              { id: 12, name: 'Fix JS bug', desc: 'this bug u know' }
            ]
          },
          {
            id: 2,
            title: 'Done',
            cards: [
              { id: 21, name: 'Fix HTML bug', desc: 'the bug u know' },
              { id: 22, name: 'Fix YOUR bug', desc: 'your bug u know' }
            ]
          }
        ]);
        
        return { lists };
      }
    });
    
    app.component('draggable', window.vuedraggable);
    
    app.component('boardy-board', {
      template: `
        <main class="flex gap-4 w-full h-svh overflow-x-auto overflow-y-hidden p-16 snap-x snap-mandatory no-scrollbar">
          <slot></slot>
        </main>
      `
    });
    
    app.component('boardy-list', {
      props: ['title', 'cards'],
      template: `
        <section class="liquid-glass [scroll-snap-stop:always] snap-center shrink-0 w-[80vw] rounded-2xl p-4 flex flex-col h-full">
          <h2 class="font-semibold text-lg mb-3">{{ title }}</h2>
          <draggable 
            :list="cards" 
            group="boardy-cards" 
            item-key="id"
            animation="200"
            ghost-class="opacity-30"
            class="flex-1 space-y-3 overflow-y-auto"
          >
            <template #item="{ element }">
              <boardy-card :name="element.name" :desc="element.desc">
            </template>
          </draggable>
        </section>
      `
    });
    
    app.component('boardy-card', {
      props: ['name', 'desc'],
      template: `
        <article class="bg-white-black p-3 rounded-xl shadow-sm cursor-grab active:cursor-grabbing select-none">
          <h3>{{ name }}</h3>
          <p class="text-gray-11 text-sm">{{ desc }}</p>
        </article>
      `
    });
    
    app.mount('#app');
  });
  </script>
  
</head>
<body>
  <div id="app" class="bg-[linear-gradient(transparent_25%,var(--gray-1)_100%),linear-gradient(90deg,var(--green-2),var(--blue-2))]">
    <h1 class="sr-only">My Boards</h1>
    
    <boardy-board>
      <boardy-list 
        v-for="list in lists" 
        :key="list.id" 
        :title="list.title" 
        :cards="list.cards" 
      />
    </boardy-board>
    
  </div>
</body>
</html>
