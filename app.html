<!DOCTYPE html>
<html lang="en">
<head>
  
  <!-- Theme Detection -->
  <script>
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark');
    }
  </script>
  
  <!-- Basic Meta Tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- SEO Meta Tags -->
  <title>My Boards - Boardy</title>
  <meta name="description" content="A deadly simple Kanban web app, no ads, no distractions, free forever.">
  <meta name="author" content="KelvinY">
  <link rel="canonical" href="https://boardy.pages.dev/app">
  
  <!-- Open Graph -->
  <meta property="og:title" content="My Boards - Boardy">
  <meta property="og:description" content="A deadly simple Kanban web app, no ads, no distractions, free forever.">
  <meta property="og:image" content="IMAGE">
  <meta property="og:url" content="https://boardy.pages.dev/app">
  <meta property="og:type" content="website">
  
  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="My Boards - Boardy">
  <meta name="twitter:description" content="A deadly simple Kanban web app, no ads, no distractions, free forever.">
  <meta name="twitter:image" content="IMAGE">
  
  <!-- iOS Optimization -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  
  <!-- External Files -->
  <!-- <link rel="icon" type="image/[TYPE]+xml" sizes="any" href="FAV">
  <link rel="apple-touch-icon" href="APPLE"> -->
  
  <!-- CSS -->
  <link rel="stylesheet" href="./assets/libraries/radix-colors.css">
  <script>
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      fetch('./input.css')
        .then(res => res.text())
        .then(cssContent => {
          
          const style = document.createElement('style');
          style.type = 'text/tailwindcss';
          style.textContent = cssContent;
          document.head.appendChild(style);
          
          const cdnScript = document.createElement('script');
          cdnScript.src = 'https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4';
          cdnScript.defer = true;
          document.head.appendChild(cdnScript);
          
        })
        .catch(err => console.error(err));
    } else {
      
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = './output.css';
      document.head.appendChild(link);
      
    }
  </script>
  
  <!-- Vue -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js" defer></script>
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const { createApp, ref, reactive, computed, watch, onMounted } = Vue;
    createApp({
      setup() {
        
      }
    }).mount('#app');
  });
  </script>
  
</head>
<body>
  <div id="app">
    
  </div>
</body>
</html>
