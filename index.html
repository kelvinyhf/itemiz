<!DOCTYPE html>
<html lang="en">
<head>
  
  <!-- Theme Detection -->
  <script>
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark');
    }
  </script>
  
  <!-- Basic Meta Tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- SEO Meta Tags -->
  <title>Notick</title>
  <meta name="description" content="DESC">
  <meta name="author" content="KelvinY">
  <link rel="canonical" href="https://notick.pages.dev/">
  
  <!-- Open Graph -->
  <meta property="og:title" content="Notick">
  <meta property="og:description" content="DESC">
  <meta property="og:image" content="IMAGE">
  <meta property="og:url" content="https://notick.pages.dev/">
  <meta property="og:type" content="website">
  
  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Notick">
  <meta name="twitter:description" content="DESC">
  <meta name="twitter:image" content="IMAGE">
  
  <!-- iOS Optimization -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  
  <!-- External Files -->
  <!-- <link rel="icon" type="image/[TYPE]+xml" sizes="any" href="FAV">
  <link rel="apple-touch-icon" href="APPLE"> -->
  
  <!-- CSS -->
  <link rel="stylesheet" href="./assets/libraries/radix-colors.css">
  <script>
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      fetch('./input.css')
        .then(res => res.text())
        .then(cssContent => {
          
          const style = document.createElement('style');
          style.type = 'text/tailwindcss';
          style.textContent = cssContent;
          document.head.appendChild(style);
          
          const cdnScript = document.createElement('script');
          cdnScript.src = './assets/libraries/tailwindcss.js';
          cdnScript.defer = true;
          document.head.appendChild(cdnScript);
          
        })
        .catch(err => console.error(err));
    } else {
      
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = './output.css';
      document.head.appendChild(link);
      
    }
  </script>
  
  <!-- Petite Vue -->
  <script src="./assets/libraries/petite-vue.js" defer></script>
  <script src="./assets/libraries/sortable.js" defer></script>
  <script src="./script.js" defer></script>
  
</head>
<body v-scope v-cloak class="w-[100svw] h-[100svh] overflow-hidden select-none" :style="{ backgroundColor: (PALETTE[getContainerById(activeContainerId)?.color] || PALETTE['none']).bgColor }">
  
  <!-- Overlay -->
  <div
    v-if="showingOverlay"
    @click="onOverlayClick()"
    class="fixed top-0 left-0 w-full h-full z-98 bg-alpha-10"
  ></div>
  
  <main class="h-full flex flex-col justify-between">
    
    <!-- Top Bar -->
    <section onwheel="this.scrollLeft += event.deltaY" id="top-bar" class="relative flex items-center bg-gray-1 border-b border-gray-3 overflow-x-auto overflow-y-hidden overscroll-none no-scrollbar">
      
      <!-- Container Tabs -->
      <div
        v-for="container in data"
        :key="container.id"
        @click="setActiveContainer(container.id)"
        :style="(() => {
          const theme = PALETTE[container.color] || PALETTE['none'];
          return {
            backgroundColor: theme.itemColor, // Use itemColor for the tab background
            color: theme.textColor,
          };
        })()"
        class="tabs h-full text-sm bg-white-black border-r border-gray-2 px-4 py-2 flex justify-center items-center gap-2 shrink-0 whitespace-nowrap"
      >
        <span>{{ container.name || 'New Container' }}</span>
        <button @click.stop="deleteContainer(container.id)" class="cursor-pointer"><svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--red-9)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
      
      <!-- Add Container Button -->
      <button
        @click="addContainer()"
        class="sticky top-0 right-0 ml-auto h-full bg-white-black text-sm px-4 py-2 shrink-0 flex items-center gap-2 whitespace-nowrap cursor-pointer"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--gray-11)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5H3"/><path d="M11 12H3"/><path d="M16 19H3"/><path d="M18 9v6"/><path d="M21 12h-6"/></svg>
        <span class="text-gray-11 font-medium">Add</span>
      </button>
      
    </section>
    
    <!-- Containers -->
    <section :data-container-id="activeContainerId" class="items-container flex-1 flex flex-col overflow-x-hidden overflow-y-auto">
      
      <!-- Items -->
      <div
        v-for="item in getItemsById(activeContainerId)"
        :key="item.id"
        @pointerdown="onItemPointerDown($event)"
        @click="openEditModal(item)"
        :style="(() => {
          const theme = PALETTE[item.color] || PALETTE['none'];
          return {
            backgroundColor: theme.itemColor,
            color: theme.textColor,
            borderColor: theme.borderColor
          };
        })()"
        class="item p-4 pr-8 last:mb-32 border-b flex items-center gap-2 cursor-pointer"
      >
        
        <!-- Checkbox -->
        <label @pointerdown.stop @click.stop class="shrink-0 flex justify-center items-center px-4 h-full">
          <input type="checkbox" v-model="item.completed" @change="save()" :class="{ 'opacity-50': item.completed }">
        </label>
        
        <!-- Title and Description -->
        <div class="flex-1 min-w-0" :class="{ 'opacity-50': item.completed }">
          <h2 class="font-medium [overflow-wrap:anywhere]">{{ item.title || 'New Item' }}</h2>
          <p class="text-sm text-gray-11 line-clamp-3 [overflow-wrap:anywhere] [white-space:pre-line]">{{ item.desc }}</p>
        </div>
        
        <!-- Due Date -->
        <span
          v-if="item.date"
          :class="[
            isOverDue(item.date) ? 'text-red-11' : 'text-gray-11',
            { 'opacity-50': item.completed }
          ]"
          class="shrink-0 text-xs ml-2"
        >{{ formatDate(item.date) }}</span>
        
      </div>

      <!-- Placeholder -->
      <div
        v-if="getItemsById(activeContainerId).length === 0"
        :style="{ color: (PALETTE[getContainerById(activeContainerId)?.color] || PALETTE['none']).textColor }"
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center font-semibold flex flex-col items-center opacity-75"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 mb-2" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.8 11.3 2 22l10.7-3.79"/><path d="M4 3h.01"/><path d="M22 8h.01"/><path d="M15 2h.01"/><path d="M22 20h.01"/><path d="m22 2-2.24.75a2.9 2.9 0 0 0-1.96 3.12c.1.86-.57 1.63-1.45 1.63h-.38c-.86 0-1.6.6-1.76 1.44L14 10"/><path d="m22 13-.82-.33c-.86-.34-1.82.2-1.98 1.11c-.11.7-.72 1.22-1.43 1.22H17"/><path d="m11 2 .33.82c.34.86-.2 1.82-1.11 1.98C9.52 4.9 9 5.52 9 6.23V7"/><path d="M11 13c1.93 1.93 2.83 4.17 2 5-.83.83-3.07-.07-5-2-1.93-1.93-2.83-4.17-2-5 .83-.83 3.07.07 5 2Z"/></svg>
        <span class="text-lg">All caught up!</span>
        <span>Click the "+" button to add items</span>
      </div>

    </section>
    
    <!-- Bottom Bar -->
    <section id="bottom-bar" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full min-h-[100px] z-99 flex justify-center items-center bg-gradient-to-b from-transparent to-gray-a4">
      
      <!-- Trash Can -->
      <div id="trash-can" class="absolute top-0 left-0 w-[calc(100%-2rem)] h-[calc(100%-2rem)] m-4 bg-red-2 border-2 border-dashed border-red-4 rounded-md hidden flex justify-center items-center">
        <span class="text-red-9 text-sm">Drop here to delete</span>
      </div>
      
      <!-- Toolbar -->
      <div id="toolbar" class="touch-manipulation bg-white-black rounded-full px-4 py-2 flex gap-2">
        <button @click="addItem(activeContainerId)" class="block text-lg bg-gray-2 rounded-full px-4 py-2 cursor-pointer"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--gray-12)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
        <button @click="openSettingModal(activeContainerId)" class="block text-lg bg-gray-2 rounded-full px-4 py-2 cursor-pointer"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--gray-12)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      
      <!-- Edit Modal -->
      <div id="edit-modal" class="w-full bg-white-black p-4 rounded-t-2xl hidden flex flex-col gap-4">
        
        <!-- Title Input -->
        <input
          type="text"
          @keyup.enter="$event.target.blur()"
          v-model="editingItem.title"
          placeholder="New Item"
          class="font-medium bg-gray-2 border border-gray-4 rounded-xl px-3 py-2 outline-none focus-visible:border-gray-12"
        >
        
        <!-- Description Input -->
        <textarea
          v-model="editingItem.desc"
          placeholder="Description (optional)"
          class="min-h-[3lh] max-h-[10lh] [field-sizing:content] bg-gray-2 border border-gray-4 rounded-xl px-3 py-2 outline-none focus-visible:border-gray-12 resize-none no-scrollbar"
        ></textarea>
        
        <!-- Due Date Input -->
        <label class="px-4 flex items-center gap-4">
          <span>Due Date:</span>
          <input
            type="date"
            v-model="editingItem.date"
            class="flex-1 bg-white-black border border-gray-4 rounded-xl py-1 text-sm text-center px-4 outline-none focus-visible:border-gray-12"
          >
        </label>
        
        <!-- Color Selection -->
        <div class="flex justify-center items-center gap-4 py-2">
          <input
            type="radio"
            v-for="(colorName, colorKey) in PALETTE"
            :key="colorKey"
            :name="editingItem.id"
            :value="colorKey"
            v-model="editingItem.color"
            :style="{ backgroundColor: colorName.previewColor }"
            class="w-6 h-6 rounded-full ring-1 ring-offset-1 ring-gray-3 appearance-none cursor-pointer transition-transform checked:ring-offset-2 checked:ring-gray-9 checked:scale-120"
          >
        </div>
        
        <!-- Save Button -->
        <button 
          @click="saveEditModal(activeContainerId)"
          class="w-full p-2 bg-gray-12 text-gray-1 font-medium rounded-xl cursor-pointer border focus-visible:border-gray-1"
        >Save</button>
        
      </div>
      
      <!-- Setting Modal -->
      <div id="setting-modal" class="w-full bg-white-black p-4 rounded-t-2xl hidden flex flex-col gap-4">
        
        <!-- Name Input -->
        <input
          type="text"
          @keyup.enter="$event.target.blur()"
          v-model="editingContainer.name"
          placeholder="New Container"
          class="font-medium bg-gray-2 border border-gray-4 rounded-xl px-3 py-2 outline-none focus-visible:border-gray-12"
        >
        
        <!-- Color Selection -->
        <div class="flex justify-center items-center gap-4 py-2">
          <input
            type="radio"
            v-for="(colorName, colorKey) in PALETTE"
            :key="colorKey"
            :name="editingContainer.id"
            :value="colorKey"
            v-model="editingContainer.color"
            :style="{ backgroundColor: colorName.previewColor }"
            class="w-6 h-6 rounded-full ring-1 ring-offset-1 ring-gray-3 appearance-none cursor-pointer transition-transform checked:ring-offset-2 checked:ring-gray-9 checked:scale-120"
          >
        </div>
        
        <!-- Save Button -->
        <button 
          @click="saveSettingModal(activeContainerId)"
          class="w-full p-2 bg-gray-12 text-gray-1 font-medium rounded-xl cursor-pointer border focus-visible:border-gray-1"
        >Save</button>
        
      </div>
      
    </section>
    
  </main>
  
</body>
</html>
