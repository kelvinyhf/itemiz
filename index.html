<!DOCTYPE html>
<html lang="en">
<head>
  
  <!-- Theme Detection -->
  <script>
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark');
    }
  </script>
  
  <!-- Basic Meta Tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- SEO Meta Tags -->
  <title>Notick</title>
  <meta name="description" content="DESC">
  <meta name="author" content="KelvinY">
  <link rel="canonical" href="https://notick.pages.dev/">
  
  <!-- Open Graph -->
  <meta property="og:title" content="Notick">
  <meta property="og:description" content="DESC">
  <meta property="og:image" content="IMAGE">
  <meta property="og:url" content="https://notick.pages.dev/">
  <meta property="og:type" content="website">
  
  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Notick">
  <meta name="twitter:description" content="DESC">
  <meta name="twitter:image" content="IMAGE">
  
  <!-- iOS Optimization -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  
  <!-- External Files -->
  <!-- <link rel="icon" type="image/[TYPE]+xml" sizes="any" href="FAV">
  <link rel="apple-touch-icon" href="APPLE"> -->
  
  <!-- CSS -->
  <link rel="stylesheet" href="./assets/libraries/radix-colors.css">
  <script>
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      fetch('./input.css')
        .then(res => res.text())
        .then(cssContent => {
          
          const style = document.createElement('style');
          style.type = 'text/tailwindcss';
          style.textContent = cssContent;
          document.head.appendChild(style);
          
          const cdnScript = document.createElement('script');
          cdnScript.src = './assets/libraries/tailwindcss.js';
          cdnScript.defer = true;
          document.head.appendChild(cdnScript);
          
        })
        .catch(err => console.error(err));
    } else {
      
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = './output.css';
      document.head.appendChild(link);
      
    }
  </script>
  
  <!-- Petite Vue -->
  <script src="./assets/libraries/petite-vue.js" defer></script>
  <script src="./assets/libraries/sortable.js" defer></script>
  <script src="./script.js" defer></script>
  
</head>
<body v-scope v-cloak class="w-[100svw] h-[100svh] overflow-hidden bg-gray-1 select-none">
  
  <!-- Overlay -->
  <div
    v-if="showingOverlay"
    @click="onOverlayClick()"
    class="fixed top-0 left-0 w-full h-full z-98 bg-alpha-10"
  ></div>
  
  <main class="h-full flex flex-col justify-between">
    
    <section></section>
    
    <!-- Items -->
    <section class="items-container flex-1 flex flex-col overflow-x-hidden overflow-y-auto">
      <div
        v-for="item in items"
        :key="item.id"
        @pointerdown="onItemPointerDown($event)"
        @click="openEditModal(item)"
        :style="(() => {
          const theme = PALETTE[item.color] || PALETTE['none'];
          return {
            backgroundColor: theme.itemColor,
            color: theme.textColor,
            borderColor: theme.borderColor
          };
        })()"
        class="item p-4 pr-8 last:mb-32 border-b flex items-center gap-2 cursor-pointer"
      >
        
        <!-- Checkbox -->
        <label @pointerdown.stop @click.stop class="shrink-0 flex justify-center items-center px-4 h-full">
          <input type="checkbox" v-model="item.completed" @change="save()" :class="{ 'opacity-50': item.completed }">
        </label>
        
        <!-- Title and Description -->
        <div class="flex-1 min-w-0" :class="{ 'opacity-50': item.completed }">
          <h2 class="font-medium [overflow-wrap:anywhere]">{{ item.title || 'Untitled' }}</h2>
          <p class="text-sm text-gray-11 line-clamp-3 [overflow-wrap:anywhere] [white-space:pre-line]">{{ item.desc }}</p>
        </div>
        
        <!-- Due Date -->
        <span
          v-if="item.date"
          :class="[
            isOverDue(item.date) ? 'text-red-11' : 'text-gray-11',
            { 'opacity-50': item.completed }
          ]"
          class="shrink-0 text-xs ml-2"
        >{{ formatDate(item.date) }}</span>
        
      </div>
    </section>
    
    <!-- Bottom Bar -->
    <section id="bottom-bar" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full min-h-[100px] z-99 flex justify-center items-center bg-gradient-to-b from-transparent to-gray-a4">
      
      <!-- Trash Can -->
      <div id="trash-can" class="absolute top-0 left-0 w-[calc(100%-2rem)] h-[calc(100%-2rem)] m-4 bg-red-2 border-2 border-dashed border-red-4 rounded-md hidden flex justify-center items-center">
        <span class="text-red-9 text-sm">Drop here to delete</span>
      </div>
      
      <!-- Add Item Button -->
      <button id="add-item" @click="addItem()" class="touch-manipulation block bg-white-black rounded-full px-4 py-2">Add Item</button>
      
      <!-- Edit Modal -->
      <div id="edit-modal" class="w-full bg-white-black p-4 rounded-t-2xl hidden flex flex-col gap-4">
        
        <!-- Title Input -->
        <input
          type="text"
          @keyup.enter="$event.target.blur()"
          v-model="editingItem.title"
          placeholder="Untitled"
          class="text-lg bg-gray-2 border border-gray-4 rounded-xl px-3 py-2 outline-none focus-visible:border-gray-12"
        >
        
        <!-- Description Input -->
        <textarea
          v-model="editingItem.desc"
          @input="autoResize($event)"
          placeholder="Description (optional)"
          class="min-h-[3lh] max-h-[10lh] bg-gray-2 border border-gray-4 rounded-xl px-3 py-2 outline-none focus-visible:border-gray-12 resize-none"
        ></textarea>
        
        <!-- Due Date Input -->
        <label class="px-4 flex items-center gap-4">
          <span>Due Date:</span>
          <input
            type="date"
            v-model="editingItem.date"
            class="flex-1 bg-white-black border border-gray-4 rounded-xl py-1 text-sm text-center outline-none focus-visible:border-gray-12"
          >
        </label>
        
        <!-- Color Selection -->
        <div class="flex justify-center items-center gap-4 py-2">
          <input
            type="radio"
            v-for="(colorName, colorKey) in PALETTE"
            :key="colorKey"
            :name="editingItem.id"
            :value="colorKey"
            v-model="editingItem.color"
            :style="{ backgroundColor: colorName.previewColor }"
            class="w-6 h-6 rounded-full ring-1 ring-offset-1 ring-gray-3 appearance-none cursor-pointer transition-transform checked:ring-offset-2 checked:ring-gray-9 checked:scale-120"
          >
        </div>
        
        <!-- Save Button -->
        <button 
          @click="saveEditModal()" 
          class="w-full p-2 bg-gray-12 text-gray-1 font-medium rounded-xl cursor-pointer"
        >Save</button>
        
    </section>
    
  </main>
  
</body>
</html>
